<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1912">
<title>Dashboard Giocatore</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#0E1912;
    --surface:#16241C;
    --surface-2:#1D3025;
    --line:#2A3F30;
    --ink:#EEF3EC;
    --muted:#8FA894;
    --accent:#FFB020;
    --accent-2:#5FA8D3;
    --accent-ink:#231400;
    --danger:#E1573C;
    --up:#7FCB94;
    --down:#E1573C;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 50% -10%, #1B2C1F 0%, var(--bg) 55%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    padding-bottom:48px;
    -webkit-font-smoothing:antialiased;
  }
  header{ padding:28px 20px 18px; border-bottom:1px solid var(--line); }
  header .kicker{ font-size:13px; color:var(--accent); font-weight:600; letter-spacing:.02em; }
  header h1{ margin:4px 0 0; font-size:28px; font-weight:800; letter-spacing:-0.01em; }
  header p{ margin:6px 0 0; color:var(--muted); font-size:14px; line-height:1.4; }
  header a{ display:inline-block; margin-top:12px; color:var(--accent); font-size:13px; font-weight:600; text-decoration:none; }
  main{ max-width:560px; margin:0 auto; padding:18px 16px 0; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px; }
  .card h2{ margin:0 0 4px; font-size:16px; font-weight:700; }
  .card .sub{ margin:0 0 16px; color:var(--muted); font-size:13px; }
  label{ display:block; font-size:12px; color:var(--muted); margin:0 0 6px; }
  select{
    width:100%; background:var(--surface-2); border:1px solid var(--line);
    color:var(--ink); border-radius:10px; padding:11px 12px; font-size:15px;
  }
  select:focus{ outline:none; border-color:var(--accent); }
  .empty{ color:var(--muted); font-size:13px; text-align:center; padding:20px 0; }

  .kpis{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
  .kpi{ background:var(--surface-2); border-radius:10px; padding:12px 10px; text-align:center; }
  .kpi .val{ font-size:19px; font-weight:800; font-variant-numeric:tabular-nums; }
  .kpi .lbl{ font-size:10px; color:var(--muted); margin-top:2px; text-transform:none; }

  .trend{
    display:inline-flex; align-items:center; gap:6px;
    font-size:13px; font-weight:600; margin-top:14px;
    padding:6px 10px; border-radius:8px; background:var(--surface-2);
  }
  .trend.up{ color:var(--up); }
  .trend.down{ color:var(--down); }
  .trend.flat{ color:var(--muted); }

  .chart-block{ margin-top:20px; }
  .chart-block .chart-title{ font-size:13px; font-weight:600; margin-bottom:8px; display:flex; justify-content:space-between; }
  .chart-block .chart-title .avg{ color:var(--muted); font-weight:400; }
  svg.chart{ width:100%; height:auto; display:block; overflow:visible; }
  .pt-label{ font-size:9px; fill:var(--muted); }
  .pt-value{ font-size:10px; fill:var(--ink); font-weight:600; }

  .table-wrap{ overflow-x:auto; margin-top:8px; }
  table{ width:100%; border-collapse:collapse; font-size:12px; }
  th, td{ text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th{ color:var(--muted); font-weight:600; font-size:11px; }
  td{ font-variant-numeric:tabular-nums; }

  .note-box{
    margin-top:16px; padding:12px 14px; background:var(--surface-2);
    border-radius:10px; font-size:13px; color:var(--ink); line-height:1.5;
  }
</style>
</head>
<body>

<header>
  <div class="kicker">Analisi evoluzione</div>
  <h1>Dashboard Giocatore</h1>
  <p>Seleziona un giocatore per vedere come sono cambiate le sue statistiche stagione dopo stagione.</p>
  <a href="index.html">← Torna al database</a>
</header>

<main>

  <div class="card">
    <label for="player-select">Giocatore</label>
    <select id="player-select">
      <option value="">Caricamento…</option>
    </select>
  </div>

  <div id="dashboard-content"></div>

</main>

<script>
(function(){
  "use strict";

  const CONFIG_KEY = "sg_gh_config";
  const CACHE_KEY = "sg_players_cache";
  const el = (id) => document.getElementById(id);

  function loadConfig(){
    try{ return JSON.parse(localStorage.getItem(CONFIG_KEY)) || {}; }
    catch(e){ return {}; }
  }
  function saveCache(players){ localStorage.setItem(CACHE_KEY, JSON.stringify(players)); }
  function loadCache(){
    try{ return JSON.parse(localStorage.getItem(CACHE_KEY)) || []; }
    catch(e){ return []; }
  }
  function configIsComplete(cfg){ return !!(cfg.owner && cfg.repo && cfg.path && cfg.token); }

  function ghHeaders(cfg){
    return { "Authorization": "Bearer " + cfg.token, "Accept": "application/vnd.github+json" };
  }
  function ghUrl(cfg){
    return `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;
  }
  function b64ToUtf8(b64){
    const bin = atob(b64.replace(/\n/g, ""));
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }
  async function ghFetchPlayers(cfg){
    const res = await fetch(ghUrl(cfg), { headers: ghHeaders(cfg) });
    if(res.status === 404) return [];
    if(!res.ok) throw new Error("Errore lettura (" + res.status + ")");
    const data = await res.json();
    try{ return JSON.parse(b64ToUtf8(data.content)); }catch(e){ return []; }
  }

  function escapeHtml(s){
    if(s == null) return "";
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  let allPlayers = [];

  function populatePlayerSelect(players){
    const names = [...new Set(players.map(p => p.nome).filter(Boolean))].sort((a,b) => a.localeCompare(b));
    const sel = el("player-select");
    if(!names.length){
      sel.innerHTML = '<option value="">Nessun giocatore in archivio</option>';
      return;
    }
    sel.innerHTML = '<option value="">Seleziona un giocatore…</option>' +
      names.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join("");
  }

  // --- Grafico SVG a linea, disegnato a mano ---------------------------

  function lineChart(points, opts){
    // points: [{label, value}], opts: {width,height,color,decimals}
    const w = 320, h = 120, padL = 28, padR = 12, padT = 16, padB = 22;
    const vals = points.map(p => p.value).filter(v => v != null);
    if(!vals.length) return '<div class="empty">Dati insufficienti</div>';

    let min = Math.min(...vals), max = Math.max(...vals);
    if(min === max){ min -= 1; max += 1; }
    const range = max - min;
    const innerW = w - padL - padR;
    const innerH = h - padT - padB;
    const n = points.length;
    const stepX = n > 1 ? innerW / (n - 1) : 0;
    const color = opts.color || "var(--accent)";
    const decimals = opts.decimals ?? 1;

    const coords = points.map((p, i) => {
      const x = padL + stepX * i;
      const y = p.value == null ? null : padT + innerH - ((p.value - min) / range) * innerH;
      return { x, y, label: p.label, value: p.value };
    });

    const validCoords = coords.filter(c => c.y != null);
    const pathD = validCoords.map((c, i) => (i === 0 ? "M" : "L") + c.x.toFixed(1) + "," + c.y.toFixed(1)).join(" ");

    const areaD = validCoords.length
      ? pathD + ` L${validCoords[validCoords.length-1].x.toFixed(1)},${(padT+innerH).toFixed(1)} L${validCoords[0].x.toFixed(1)},${(padT+innerH).toFixed(1)} Z`
      : "";

    const dots = validCoords.map(c => `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3" fill="${color}"/>`).join("");
    const valueLabels = validCoords.map(c =>
      `<text class="pt-value" x="${c.x.toFixed(1)}" y="${(c.y-8).toFixed(1)}" text-anchor="middle">${c.value.toFixed(decimals)}</text>`
    ).join("");
    const xLabels = coords.map(c =>
      `<text class="pt-label" x="${c.x.toFixed(1)}" y="${h-6}" text-anchor="middle">${escapeHtml(c.label)}</text>`
    ).join("");

    return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
      <line x1="${padL}" y1="${padT+innerH}" x2="${w-padR}" y2="${padT+innerH}" stroke="var(--line)" stroke-width="1"/>
      <path d="${areaD}" fill="${color}" opacity="0.12"/>
      <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2"/>
      ${dots}
      ${valueLabels}
      ${xLabels}
    </svg>`;
  }

  function trendInfo(values){
    const clean = values.filter(v => v != null);
    if(clean.length < 2) return null;
    const first = clean[0], last = clean[clean.length - 1];
    const delta = last - first;
    const pct = first !== 0 ? (delta / Math.abs(first)) * 100 : 0;
    return { delta, pct, direction: delta > 0.001 ? "up" : delta < -0.001 ? "down" : "flat" };
  }

  function avg(values){
    const clean = values.filter(v => v != null);
    if(!clean.length) return null;
    return clean.reduce((a,b) => a+b, 0) / clean.length;
  }

  function renderDashboard(nome){
    const container = el("dashboard-content");
    if(!nome){
      container.innerHTML = "";
      return;
    }
    const seasons = allPlayers
      .filter(p => p.nome === nome)
      .sort((a,b) => (a.anno||"").localeCompare(b.anno||""));

    if(!seasons.length){
      container.innerHTML = '<div class="card"><div class="empty">Nessun dato per questo giocatore.</div></div>';
      return;
    }

    const labels = seasons.map(s => s.anno || "?");
    const fmvVals = seasons.map(s => s.fmv);
    const mvVals = seasons.map(s => s.mv);
    const golVals = seasons.map(s => s.gol);
    const assistVals = seasons.map(s => s.assist);

    const fmvTrend = trendInfo(fmvVals);
    const totGol = seasons.reduce((a,s) => a + (s.gol||0), 0);
    const totAssist = seasons.reduce((a,s) => a + (s.assist||0), 0);
    const totPartite = seasons.reduce((a,s) => a + (s.partite||0), 0);
    const totInfortuni = seasons.reduce((a,s) => a + (s.infortuni||0), 0);
    const avgFmv = avg(fmvVals);
    const avgMv = avg(mvVals);

    const bestSeason = [...seasons].sort((a,b) => (b.fmv||-Infinity) - (a.fmv||-Infinity))[0];

    let trendHtml = "";
    if(fmvTrend){
      const dir = fmvTrend.direction;
      const arrow = dir === "up" ? "↗" : dir === "down" ? "↘" : "→";
      const cls = dir;
      const word = dir === "up" ? "in crescita" : dir === "down" ? "in calo" : "stabile";
      trendHtml = `<div class="trend ${cls}">${arrow} Fantamedia ${word}: ${fmvTrend.delta > 0 ? "+" : ""}${fmvTrend.delta.toFixed(2)} dalla prima all'ultima stagione registrata</div>`;
    }

    const rows = seasons.map(s => `
      <tr>
        <td>${escapeHtml(s.anno)}</td>
        <td>${s.partite ?? "–"}</td>
        <td>${s.gol ?? "–"}</td>
        <td>${s.assist ?? "–"}</td>
        <td>${s.mv ?? "–"}</td>
        <td>${s.fmv ?? "–"}</td>
      </tr>`).join("");

    container.innerHTML = `
      <div class="card">
        <h2>${escapeHtml(nome)}</h2>
        <p class="sub">${seasons.length} stagion${seasons.length === 1 ? "e" : "i"} registrat${seasons.length === 1 ? "a" : "e"}${seasons[0].ruolo ? " · " + escapeHtml(seasons[0].ruolo) : ""}</p>

        <div class="kpis">
          <div class="kpi"><div class="val">${totGol}</div><div class="lbl">gol totali</div></div>
          <div class="kpi"><div class="val">${totAssist}</div><div class="lbl">assist totali</div></div>
          <div class="kpi"><div class="val">${totPartite}</div><div class="lbl">presenze totali</div></div>
        </div>
        <div class="kpis">
          <div class="kpi"><div class="val">${avgFmv != null ? avgFmv.toFixed(2) : "–"}</div><div class="lbl">fantamedia media</div></div>
          <div class="kpi"><div class="val">${avgMv != null ? avgMv.toFixed(2) : "–"}</div><div class="lbl">media voto media</div></div>
          <div class="kpi"><div class="val">${totInfortuni}</div><div class="lbl">infortuni totali</div></div>
        </div>

        ${trendHtml}

        ${bestSeason && bestSeason.fmv != null ? `<div class="note-box">Miglior stagione per fantamedia: <strong>${escapeHtml(bestSeason.anno)}</strong> con fmv ${bestSeason.fmv}.</div>` : ""}
      </div>

      <div class="card">
        <div class="chart-block">
          <div class="chart-title"><span>Fantamedia per stagione</span><span class="avg">media ${avgFmv != null ? avgFmv.toFixed(2) : "–"}</span></div>
          ${lineChart(labels.map((l,i) => ({label:l, value: fmvVals[i]})), {color:"var(--accent)", decimals:2})}
        </div>
        <div class="chart-block">
          <div class="chart-title"><span>Media voto per stagione</span><span class="avg">media ${avgMv != null ? avgMv.toFixed(2) : "–"}</span></div>
          ${lineChart(labels.map((l,i) => ({label:l, value: mvVals[i]})), {color:"var(--accent-2)", decimals:2})}
        </div>
        <div class="chart-block">
          <div class="chart-title"><span>Gol per stagione</span></div>
          ${lineChart(labels.map((l,i) => ({label:l, value: golVals[i]})), {color:"var(--up)", decimals:0})}
        </div>
        <div class="chart-block">
          <div class="chart-title"><span>Assist per stagione</span></div>
          ${lineChart(labels.map((l,i) => ({label:l, value: assistVals[i]})), {color:"var(--danger)", decimals:0})}
        </div>
      </div>

      <div class="card">
        <h2>Dettaglio stagioni</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Anno</th><th>Pres.</th><th>Gol</th><th>Ass.</th><th>MV</th><th>FMV</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  el("player-select").addEventListener("change", (e) => {
    renderDashboard(e.target.value);
  });

  async function init(){
    const cfg = loadConfig();
    if(configIsComplete(cfg)){
      try{
        allPlayers = await ghFetchPlayers(cfg);
        saveCache(allPlayers);
      }catch(e){
        allPlayers = loadCache();
      }
    }else{
      allPlayers = loadCache();
    }
    populatePlayerSelect(allPlayers);
  }

  init();

  if("serviceWorker" in navigator){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
})();
</script>

</body>
</html>
